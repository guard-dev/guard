AWSTemplateFormatVersion: '2010-09-09'
Description: |
  This template creates the GuardSecurityScanRole IAM role in your AWS account 
  with the necessary read-only permissions for Guard to perform security scans.
  The role will allow Guard to assume the role using AWS Security Token Service (STS).
Parameters:
  ExternalId:
    Description: |
      The External ID Guard will use to assume this role. DO NOT CHANGE THIS.
    Type: String

Resources:
  GuardSecurityScanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GuardSecurityScanRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: "arn:aws:iam::591907732013:root"
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      MaxSessionDuration: 21600
      Policies:
        - PolicyName: GuardPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'account:Get*'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 'apigateway:GET'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 'cloudtrail:GetInsightSelectors'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 'dynamodb:ListTables'
                  - 'dynamodb:DescribeTable'
                  - 'dynamodb:DescribeContinuousBackups'
                  - 'dynamodb:DescribeTimeToLive'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 'ec2:DescribeInstances'
                  - 'ec2:DescribeVolumes'
                  - 'ec2:DescribeSecurityGroups'
                  - 'ec2:DescribeAddresses'
                  - 'ec2:DescribeInstanceAttribute'
                  - 'ec2:DescribeVolumesModifications'
                  - 'ec2:DescribeInstanceStatus'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 'ecr:Describe*'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 'ecs:ListClusters'
                  - 'ecs:DescribeTaskDefinition'
                  - 'ecs:ListTaskDefinitions'
                  - 'ecs:DescribeTasks'
                  - 'ecs:DescribeContainerInstances'
                  - 'ecs:ListServices'
                  - 'ecs:DescribeServices'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 'glue:GetConnections'
                  - 'glue:GetSecurityConfiguration*'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 'iam:GetRole'
                  - 'iam:List*'
                  - 'iam:GetPolicy'
                  - 'iam:GetPolicyVersion'
                  - 'iam:GetAccountSummary'
                  - 'iam:GetAccessKeyLastUsed'
                  - 'iam:GetLoginProfile'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 'lambda:ListFunctions'
                  - 'lambda:GetFunction*'
                  - 'lambda:GetPolicy'
                  - 'lambda:GetLayerVersion'
                  - 'lambda:ListTags'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 'logs:FilterLogEvents'
                  - 'logs:DescribeLogGroups'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 'macie2:GetMacieSession'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 's3:ListAllMyBuckets'
                  - 's3:GetBucket*'
                  - 's3:GetAccountPublicAccessBlock'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 'securityhub:GetFindings'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 'ssm:GetDocument'
                  - 'ssm-incidents:List*'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 'tag:GetTagKeys'
                Resource: "*"
      Tags:
        - Key: "Service"
          Value: "https://www.guard.dev"
        - Key: "Support"
          Value: "support@guard.dev"
        - Key: "CloudFormation"
          Value: "true"
        - Key: "Name"
          Value: "GuardSecurityScanRole"

